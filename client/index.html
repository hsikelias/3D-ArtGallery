<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HackNite - Gallery inspection</title>
  </head>
  <body>
    <main>
      <div id="viewport"></div>
      <section class="panel" aria-labelledby="gallery-heading">
        <p class="eyebrow">HackNite / Stage 1</p>
        <h1 id="gallery-heading">Gallery inspection</h1>
        <p id="setup-status" role="status">Loading the Blender gallery...</p>
        <p id="scene-details"></p>
        <p>Drag to orbit / Scroll to zoom / Right-drag to pan</p>
        <p>Free inspection camera: wall collision comes with the player controls.</p>
        <button id="reset-view" type="button">Reset view</button>
        <label><input id="inspection-light" type="checkbox" checked /> Inspection lighting</label>
      </section>
      <noscript>Enable JavaScript to view the gallery.</noscript>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
